<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我们的游戏站</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar">
    <span class="brand">我们的游戏站</span>
    <div id="authArea" class="auth-area"></div>
  </header>

  <div id="app">
    <!-- 大厅 -->
    <section id="lobby">
      <p class="tip">一个人点「创建房间」拿到 4 位房间号发给对方，另一个人输入房间号点「加入」，就能一起玩啦。</p>
      <p id="lobbyHint" class="hint"></p>
      <div class="nick-line">
        <label>我的昵称：</label>
        <input id="nickInput" placeholder="取个昵称" maxlength="12" value="游客" />
      </div>
      <button id="createBtn" class="primary">创建房间</button>
      <div class="join">
        <input id="roomInput" placeholder="输入4位房间号" maxlength="4" inputmode="numeric" />
        <button id="joinBtn">加入</button>
      </div>
    </section>

    <!-- 房间 -->
    <section id="room" hidden>
      <div class="room-header">
        <div class="room-code-box">
          <span class="rc-label">房间号</span>
          <span id="roomCodeBig" class="rc-code">0000</span>
          <button id="copyRoomCode">复制</button>
        </div>
        <div class="room-players">
          <div class="player host">
            <span id="hostName" class="p-name">房主</span><span class="p-tag">房主</span>
          </div>
          <div class="player guest">
            <span id="guestName" class="p-name empty">等待对方加入…</span><span id="guestTag" class="p-tag" hidden>玩家</span>
          </div>
        </div>
      </div>

      <!-- 房主设置面板 -->
      <div id="hostPanel" class="room-settings" hidden>
        <h3>房间设置</h3>
        <div class="rs-row">
          <label>房间密码</label>
          <div class="rs-pwd">
            <input id="roomPwd" type="password" placeholder="不设置则公开" maxlength="12" />
            <button id="setPwdBtn">设置</button>
            <button id="clearPwdBtn" hidden>清除</button>
          </div>
        </div>
        <div class="rs-row">
          <label>选择游戏</label>
          <div id="roomGameList" class="room-game-list"></div>
        </div>
        <p id="roomHint" class="hint"></p>
        <button id="startGameBtn" class="primary" disabled>开始游戏</button>
      </div>

      <!-- 加入者等待面板 -->
      <div id="guestPanel" class="room-wait" hidden>
        <p>等待房主选择游戏并开始…</p>
        <p class="rw-game">当前游戏：<b id="selectedGameName">未选择</b></p>
      </div>

      <button id="leaveRoomBtn" class="ghost">← 返回大厅</button>
    </section>

    <!-- 游戏 -->
    <section id="game" hidden>
      <div class="game-top">
        <button id="backBtn">← 返回房间</button>
        <span id="gameTitle" class="game-title"></span>
      </div>
      <div id="gameRoot"></div>
    </section>

    <!-- 我的记录 -->
    <section id="profile" hidden></section>

    <!-- 管理后台 -->
    <section id="admin" hidden></section>
  </div>

  <!-- 浮动聊天 -->
  <div id="chatPanel" class="chat-panel" hidden>
    <div class="chat-head">悄悄话</div>
    <div id="chatLog" class="chat-log"></div>
    <div class="chat-input">
      <input id="chatInput" placeholder="说点什么…" maxlength="120" />
      <button id="chatSend">发送</button>
    </div>
  </div>

  <!-- 登录/注册弹窗 -->
  <div id="authModal" class="modal" hidden>
    <div class="modal-box">
      <button id="authClose" class="modal-close">×</button>
      <h2 id="authTitle">登录</h2>
      <form id="loginForm" onsubmit="return false">
        <input id="loginUser" placeholder="用户名" maxlength="20" />
        <input id="loginPass" type="password" placeholder="密码" />
        <button id="loginSubmit" class="primary">登录</button>
        <p id="loginErr" class="err"></p>
      </form>
      <form id="regForm" hidden onsubmit="return false">
        <input id="regUser" placeholder="用户名（3-20位字母/数字/下划线）" maxlength="20" />
        <input id="regPass" type="password" placeholder="密码（至少6位）" />
        <input id="regNick" placeholder="昵称（选填）" maxlength="12" />
        <button id="regSubmit" class="primary">注册并登录</button>
        <p id="regErr" class="err"></p>
      </form>
      <p id="authSwitch" class="switch"></p>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
