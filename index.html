<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我们的游戏站</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar">
    <span class="brand">我们的游戏站</span>
    <div id="authArea" class="auth-area"></div>
  </header>

  <div id="app">
    <!-- 大厅 -->
    <section id="lobby">
      <p class="tip">一个人点「创建房间」拿到房间号发给对方，另一个人输入房间号点「加入」，就能一起玩啦。</p>
      <p id="lobbyHint" class="hint"></p>
      <button id="createBtn" class="primary">创建房间</button>
      <div class="join">
        <input id="roomInput" placeholder="输入对方给的房间号" />
        <button id="joinBtn">加入</button>
      </div>
    </section>

    <!-- 菜单 -->
    <section id="menu" hidden>
      <div id="menuStatus" class="status-line"></div>
      <div class="room-bar">房间号：<b id="roomCode"></b> <button id="copyBtn">复制</button></div>
      <p class="sub">选一个游戏开始：</p>
      <div id="gameList" class="game-list"></div>
    </section>

    <!-- 游戏 -->
    <section id="game" hidden>
      <div class="game-top">
        <button id="backBtn">← 菜单</button>
        <span id="gameTitle" class="game-title"></span>
      </div>
      <div id="gameRoot"></div>
    </section>

    <!-- 我的记录 -->
    <section id="profile" hidden></section>

    <!-- 管理后台 -->
    <section id="admin" hidden></section>
  </div>

  <!-- 浮动聊天 -->
  <div id="chatPanel" class="chat-panel" hidden>
    <div class="chat-head">悄悄话</div>
    <div id="chatLog" class="chat-log"></div>
    <div class="chat-input">
      <input id="chatInput" placeholder="说点什么…" maxlength="120" />
      <button id="chatSend">发送</button>
    </div>
  </div>

  <!-- 登录/注册弹窗 -->
  <div id="authModal" class="modal" hidden>
    <div class="modal-box">
      <button id="authClose" class="modal-close">×</button>
      <h2 id="authTitle">登录</h2>
      <form id="loginForm" onsubmit="return false">
        <input id="loginUser" placeholder="用户名" maxlength="20" />
        <input id="loginPass" type="password" placeholder="密码" />
        <button id="loginSubmit" class="primary">登录</button>
        <p id="loginErr" class="err"></p>
      </form>
      <form id="regForm" hidden onsubmit="return false">
        <input id="regUser" placeholder="用户名（3-20位字母/数字/下划线）" maxlength="20" />
        <input id="regPass" type="password" placeholder="密码（至少6位）" />
        <input id="regNick" placeholder="昵称（选填）" maxlength="12" />
        <button id="regSubmit" class="primary">注册并登录</button>
        <p id="regErr" class="err"></p>
      </form>
      <p id="authSwitch" class="switch"></p>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
