<body data-page-node-id="P0wclCKaPmFu1bEEFMcskI">

  <div id="app" data-page-node-id="XZEQ2VHvVya5wxkBxtUk1P">

      <p class="tip" data-page-node-id="Tky0vG89mGhpKcEcIXHjkD">一个人点「创建房间」拿到 4 位房间号发给对方，另一个人输入房间号点「加入」，就能一起玩啦。</p>
      <p id="lobbyHint" class="hint" data-page-node-id="sckSnaFxaQYgvB32LJAsVy"></p>

        <label data-page-node-id="ZGL9Y2D5TPViTwD0XkfqVf">我的昵称：</label>
        <input id="nickInput" placeholder="取个昵称" maxlength="12" value="游客" data-page-node-id="QSZ296O1NdsRhtRBh21wqc" />
      </div>
      <button id="createBtn" class="primary" data-page-node-id="c4hQ6UIXBnbuV59vKxUT6b">创建房间</button>
      <div class="join" data-page-node-id="G5c6QUY6JzbLB23hyarfcr">
        <input id="roomInput" placeholder="输入4位房间号" maxlength="4" inputmode="numeric" data-page-node-id="N2QAc5dKObmp9XscLJFPAY" />

          <button id="copyRoomCode" data-page-node-id="WhL77ZDHa7DNl1OKKtkgLW">复制</button>
        </div>
        <div class="room-players" data-page-node-id="lkVHT1SMpV4F8Ou1dqM3SC">
          <div class="player host" data-page-node-id="5ycYLSjWLER5Rgp7QE7oD0">
            <span id="hostName" class="p-name" data-page-node-id="IpxEtNnQtJygQ7TmsBpUfH">房主</span><span class="p-tag" data-page-node-id="kvN1gSAPfvwC3ocYFa1urx">房主</span>
          </div>
          <div class="player guest" data-page-node-id="JpfHmt2ewCbc0fVkBARuHi">
            <span id="guestName" class="p-name empty" data-page-node-id="RTkC3QZ0mGHG8QqKbCTtMO">等待对方加入…</span><span id="guestTag" class="p-tag" hidden data-page-node-id="EgVnenKo4DAPLahbWe4BPL">玩家</span>

          <label data-page-node-id="rPh5dFQzvawSJyUZBb5DPn">房间密码</label>
          <div class="rs-pwd" data-page-node-id="DCSkXNnwdxufjZ6cRceymR">

            <button id="setPwdBtn" data-page-node-id="6Wb0sUCOlBNVRFnVjsjHnn">设置</button>
            <button id="clearPwdBtn" hidden data-page-node-id="VDzxOieRfRbF0UFoOoLJqB">清除</button>

        </div>
        <div class="rs-row" data-page-node-id="1xOcOOmbiNX60TqB6Yezbx">

        <p data-page-node-id="LiNE1kPC4U7vFjkBNyPRD3">等待房主选择游戏并开始…</p>

    </section>

    <section id="admin" hidden data-page-node-id="CAjpRvB3UQ4MNhKiNvdCOi"></section>

        <input id="loginUser" placeholder="用户名" maxlength="20" data-page-node-id="Db6bzu08cBpDaxden4i8B1" />
        <input id="loginPass" type="password" placeholder="密码" data-page-node-id="bgCvFhgxbiKudiE4Ag6seh" />
        <button id="loginSubmit" class="primary" data-page-node-id="7SsTquP87BVXeFRxACt2yP">登录</button>

      </form>

        <input id="regNick" placeholder="昵称（选填）" maxlength="12" data-page-node-id="SalClj6BQsUeCyG3u342hH" />

    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
