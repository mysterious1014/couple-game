# Render 部署配置（Blueprint）
# 在 Render 后台「New」→「Blueprint」选择本仓库即可自动按此配置部署。
services:
  - type: web
    name: couple-game
    rootDir: server          # 构建/启动在 server 目录下进行
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # better-sqlite3@12 需要 Node 20.x / 22.x+，这里锁死主版本，避免默认版本漂移导致原生模块装不上
      - key: NODE_VERSION
        value: "22"
      # ⚠️ Free 计划的磁盘是临时的：每次部署/重启都会清空 server/data/，SQLite 文件也一样丢。
      # 推荐：New → Postgres 建一个数据库，把连接串放到下面这个变量里，
      # 存储层会自动切到 Postgres 驱动（见 server/store/），数据就不再依赖实例磁盘。
      # 老数据用 node tools/migrate-storage.mjs --from sqlite --to postgres --to-url "$DATABASE_URL" --apply 搬上去。
      # - key: DATABASE_URL
      #   value: postgres://user:password@host:5432/dbname
      #
      # 或者：升级 Starter 及以上并挂载 Persistent Disk，再打开下面这行指向挂载点。
      # - key: DATA_DIR
      #   value: /var/data/couple-game
    # Render 会自动注入 PORT 环境变量，server/index.js 已读取 process.env.PORT
    # 健康检查：Render 默认探测 Web 服务端口，无需额外配置
